name: Notify Pro Repo of Changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify-pro:
    runs-on: ubuntu-latest
    if: github.repository == 'open-kode/openkode-free'
    
    steps:
      - name: Trigger Pro repo sync
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PRO_REPO_PAT }}
          repository: open-kode/openkode-pro
          event-type: free-repo-updated
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.event.head_commit.author.name }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
