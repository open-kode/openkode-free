name: Publish Free Edition

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0-beta)'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @vscode/vsce ovsx
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Build extension (Free Edition)
        run: |
          export OPENKODE_EDITION=free
          npm run compile
      
      - name: Run tests
        run: |
          npm run test:unit || true
      
      - name: Package extension
        run: |
          vsce package --no-dependencies --out "openkode-free-${{ steps.version.outputs.version }}.vsix"
      
      - name: Generate checksums
        run: |
          sha256sum "openkode-free-${{ steps.version.outputs.version }}.vsix" > checksums.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkode-free-${{ steps.version.outputs.version }}
          path: |
            openkode-free-*.vsix
            checksums.txt
          retention-days: 90
      
      # Publish to Open VSX Registry (primary for free/open source)
      - name: Publish to Open VSX
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n "$OVSX_PAT" ]]; then
            echo "Publishing to Open VSX..."
            ovsx publish "openkode-free-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
          else
            echo "OVSX_PAT not set, skipping Open VSX publish"
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      
      # Publish to VS Code Marketplace (if PAT is available)
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n "$VSCE_PAT" ]]; then
            echo "Publishing to VS Code Marketplace..."
            vsce publish --packagePath "openkode-free-${{ steps.version.outputs.version }}.vsix" -p "$VSCE_PAT"
          else
            echo "VSCE_PAT not set, skipping VS Code Marketplace publish"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      
      - name: Update GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            openkode-free-*.vsix
            checksums.txt
          body: |
            ## OpenKode Free ${{ steps.version.outputs.version }}
            
            ### Installation
            
            **Option 1: Install from Open VSX (recommended)**
            ```
            code --install-extension openkode.openkode-free
            ```
            
            **Option 2: Download and install manually**
            ```
            code --install-extension openkode-free-${{ steps.version.outputs.version }}.vsix
            ```
            
            ### What's New
            
            See [CHANGELOG.md](CHANGELOG.md) for full details.
            
            ### Upgrade to Pro
            
            Need cloud LLMs and team features? [Upgrade to OpenKode Pro](https://open-kode.dev/pro)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create a release if triggered by tag push without existing release
  create-release:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openkode-free-${{ needs.build-and-publish.outputs.version }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            openkode-free-*.vsix
            checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
          body: |
            ## OpenKode Free ${{ needs.build-and-publish.outputs.version }}
            
            🎉 Automatically published from tag ${{ github.ref }}
            
            ### Installation
            
            Download the `.vsix` file and install:
            ```bash
            code --install-extension openkode-free-${{ needs.build-and-publish.outputs.version }}.vsix
            ```
            
            Or get it from Open VSX once approved.
            
            ### Upgrade to Pro
            
            [Get OpenKode Pro](https://open-kode.dev/pro) for cloud LLMs, Smart OpenRouter, and team features.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify installation works
  verify:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name != 'push'
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openkode-free-${{ needs.build-and-publish.outputs.version }}
      
      - name: Verify VSIX structure
        run: |
          # Check VSIX is valid zip
          unzip -t "openkode-free-${{ needs.build-and-publish.outputs.version }}.vsix"
          
          # Check package.json exists
          unzip -p "openkode-free-${{ needs.build-and-publish.outputs.version }}.vsix" extension/package.json | jq .
          
          # Verify edition is free
          EDITION=$(unzip -p "openkode-free-${{ needs.build-and-publish.outputs.version }}.vsix" extension/package.json | jq -r '.name')
          if [[ "$EDITION" == "openkode-free" ]]; then
            echo "✅ Verified: Free edition package"
          else
            echo "⚠️  Warning: Package name is '$EDITION'"
          fi
      
      - name: Output verification results
        run: |
          echo "✅ Build verification complete"
          echo "📦 Artifact: openkode-free-${{ needs.build-and-publish.outputs.version }}.vsix"
          ls -lh "openkode-free-${{ needs.build-and-publish.outputs.version }}.vsix"
